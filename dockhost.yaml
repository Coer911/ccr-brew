# Dockhost project ccr-brew — Cultura Brew (Telegram Mini App @Brewing_ccrbot)
# Применить на Mac:
#   dockhost compose apply ./dockhost.yaml
#
# Секреты — только в env проекта Dockhost, не здесь:
#   BOT_TOKEN, BOT_WEBHOOK_SECRET, SESSION_SECRET, DATABASE_URL, PUBLIC_URL

version: 1
project: ccr-brew

environment:
  variables:
    ADMIN_TELEGRAM_IDS: "255308651"
    BOT_USERNAME: "Brewing_ccrbot"

repositories:
  brew:
    url: https://github.com/Coer911/ccr-brew.git
    branch: main
    dockerFile: Dockerfile
    dockerContext: .
    memory: 1GiB
    cpu: 1
    cpuFraction: 50
    state: present

containers:
  brew:
    # После успешной сборки repository brew подставьте полный Git SHA образа.
    image: dockhost.io/<PROJECT_ID>/build/brew:<GIT_SHA>
    replicas: 1
    resources:
      memory: 512MiB
      cpu: 1
      cpuFraction: 20
    ports:
      - 3000/TCP
    variables:
      BOT_TOKEN: $BOT_TOKEN
      BOT_WEBHOOK_SECRET: $BOT_WEBHOOK_SECRET
      SESSION_SECRET: $SESSION_SECRET
      DATABASE_URL: $DATABASE_URL
      # Бесплатный https-домен Dockhost, который выдаст роут ниже.
      PUBLIC_URL: $PUBLIC_URL
      ADMIN_TELEGRAM_IDS: $ADMIN_TELEGRAM_IDS
      BOT_USERNAME: $BOT_USERNAME

network:
  domains:
    brew: ~
  routes:
    brew-route:
      domain: brew
      path: /
      type: internal
      service: brew
      port: 3000/TCP
