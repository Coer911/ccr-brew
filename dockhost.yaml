# Dockhost: проект price (c46c3394-2aac-4840-9d40-444fe77e95b4) — Cultura Brew
# (статичный сайт, nginx слушает 80 и 8080).
# Сервер и база не нужны, переменных окружения и секретов нет.
#
# На Mac:
#   export PATH="$HOME/.dockhost/bin:$PATH"
#   dockhost repository build --name brew --project price
#   # подставьте полный Git SHA собранного образа в containers.brew.image
#   dockhost compose apply ./dockhost.yaml

version: 1
project: price

repositories:
  brew:
    url: https://github.com/Coer911/ccr-brew.git
    branch: gpl-fork
    dockerFile: Dockerfile
    dockerContext: .
    # Сборке Next.js нужна память; самому контейнеру хватает 256 MiB.
    memory: 2GiB
    cpu: 1
    cpuFraction: 50
    state: present

containers:
  brew:
    image: dockhost.io/c46c3394-2aac-4840-9d40-444fe77e95b4/build/brew:<GIT_SHA>
    replicas: 1
    resources:
      memory: 256MiB
      cpu: 1
      cpuFraction: 20
    ports:
      - 8080/TCP

network:
  domains:
    brew: ~
  routes:
    brew-route:
      domain: brew
      path: /
      type: internal
      service: brew
      port: 8080/TCP
