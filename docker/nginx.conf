server {
  # Оба порта: Dockhost по умолчанию ведёт трафик на 80, в dockhost.yaml указан 8080.
  listen 80;
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Service Worker и манифест не кешируем, чтобы обновления приходили сразу.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
